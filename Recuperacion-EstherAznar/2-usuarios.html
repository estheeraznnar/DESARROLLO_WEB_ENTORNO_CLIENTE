<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Consumo de API REST usuarios</title>
</head>
<body>

  <h1>Usuarios</h1>
  
  <input type="button" value="Cargar Usuarios" onclick="cargarUssuarios()"></button>
  <ul id="lista">
  </ul>
  

  <script>
    const boton = document.getElementById("cargar");
    const lista = document.getElementById("lista");
    
    function cargarUssuarios(){
      
      fetch('https://jsonplaceholder.typicode.com/users') 
        .then(response => {
          if (!response.ok) throw new Error("Error al cargar usuarios");
          return response.json();
        })
        .then(data => {
          usuario = data;
          console.log("usuarios cargados:", usuario);
          mostrarlista(usuario);
        })
        .catch(error => {
          console.error("Error:", error);
          alert("Error al cargar los usuarios");
        });

      function mostrarlista(arr){
        
        arr.forEach(item => {
          console.log(item)
          nuevoHijo = document.createElement("LI");
          nuevoTexto = document.createTextNode(`${item.name} - ${item.email}`)
          
          nuevoHijo.appendChild(nuevoTexto);
          document.getElementById("lista").appendChild(nuevoHijo);
        });
        
      }
      
      
      
    }
    
    

  </script>
  
</body>
</html>
